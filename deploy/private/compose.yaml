name: crm-demo

services:
  crm-demo:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: crm-demo:${CRM_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - ${CRM_ENV_FILE:-/opt/crm-platform/secrets/crm-demo.env}
    command:
      - serve
      - --http=0.0.0.0:8090
      - --dir=/data
      - --encryptionEnv=PB_ENCRYPTION_KEY
    volumes:
      - /srv/crm-data/crm-demo:/data
    networks:
      default:
      assistant:
        aliases:
          - crm-demo-assistant
    expose:
      - "8090"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      crm-demo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:

networks:
  assistant:
    external: true
    name: crm-assistant
